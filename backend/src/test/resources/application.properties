# Test-only overrides so @SpringBootTest can build the application context
# without going through BackendApplication's manual .env loading and
# without a live MongoDB instance.
#
# - The "test" profile disables UserDataSeeder/CourseDataSeeder (see their
#   @Profile("!test")), which are the only things that would otherwise run
#   a real query against Mongo during context startup.
# - A non-empty username keeps the Mongo connection string itself valid
#   (the driver rejects an empty username when an auth database is set).
spring.profiles.active=test
spring.mongodb.username=test
spring.mongodb.password=test

app.jwt.secret=test-jwt-secret-at-least-32-characters-long-for-tests
app.jwt.expiration-minutes=60
