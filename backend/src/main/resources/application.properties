spring.application.name=backend

# MongoDB connection. Values come from environment variables (loaded from
# .env by BackendApplication at startup) so real credentials never need to
# be hardcoded here or committed to git.
spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE:course_enrolment_db}
spring.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:course_enrolment_db}
spring.mongodb.username=${MONGODB_USERNAME:}
spring.mongodb.password=${MONGODB_PASSWORD:}

# JWT settings
# app.jwt.secret must be at least 32 characters (HMAC-SHA256 requirement).
app.jwt.secret=${JWT_SECRET:course-enrolment-dev-secret-key-change-me-please-32chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
